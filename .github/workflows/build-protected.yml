name: Prepare deployment distribution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protected-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install exact build dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lockfile
        run: test -s package-lock.json
      - name: Verify exact local Wrangler pin
        run: |
          node -e "const p=require('./package.json'); const v=require('./node_modules/wrangler/package.json').version; if(v!==p.devDependencies.wrangler) throw new Error('Wrangler version mismatch'); console.log('Wrangler '+v)"
      - name: Check notification sound preferences and integration
        run: npm run check:notification-sounds
      - name: Check notification Realtime, reconnection and arrival animation
        run: npm run check:notification-reliability
      - name: Check navigation and synchronization indicator contract
        run: npm run check:navigation
      - name: Check offline and cloud sync contract
        run: npm run check:sync
      - name: Verify global UI standards
        run: npm run check:ui
      - name: Check routine domain and recurrence
        run: npm run check:routine
      - name: Check Service Worker offline and HTTP fallback
        run: npm run check:service-worker
      - name: Check shared picker components
        run: npm run check:pickers
      - name: Check bakery recipe form and shared launch integration
        run: npm run check:recipes
      - name: Check notes module and security contract
        run: npm run check:notes
      - name: Build protected Cloudflare distribution
        run: npm run build:protected
      - name: Validate Cloudflare deployment configuration without publishing
        run: npx wrangler deploy --dry-run
      - name: Block builds on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify protected distribution
        run: |
          test -s dist/index.html
          test -s dist/avaliacao.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/logo.webp
          test -s dist/icon.svg
          test -s dist/routine.js
          test -s dist/pickers.js
          test -s dist/notes.js
          test -s dist/notification-sounds.js
          test -s dist/LICENSE
          test ! -d dist/supabase
          test ! -d dist/.github
          test ! -d dist/scripts
          test ! -f dist/package.json
          test ! -f dist/package-lock.json
          test "$(find dist -type f | wc -l | tr -d ' ' )" = "11"
          ! find dist -type f -name '*.map' | grep .
          ! grep -R -E 'sourceMappingURL=|SUPABASE_SERVICE_ROLE_KEY|sb_secret_[A-Za-z0-9_-]+' dist
      - name: Deploy isolated pull request preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5c42f7e3b18d14a12db0610b88eb8c9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN to publish an isolated PR preview."
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc --name "super-tudo-pr${{ github.event.pull_request.number }}"
      - name: Deploy protected distribution to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5c42f7e3b18d14a12db0610b88eb8c9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure the CLOUDFLARE_API_TOKEN repository secret with Workers Scripts Write permission."
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
      - name: Upload protected distribution
        uses: actions/upload-artifact@v7
        with:
          name: super-tudo-protegido
          path: dist/
          if-no-files-found: error
          retention-days: 14
