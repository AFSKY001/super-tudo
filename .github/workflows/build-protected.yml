name: Prepare deployment distribution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact build dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lockfile
        run: test -s package-lock.json
      - name: Prepare existing protected bundle (no re-obfuscation)
        run: npm run build:deploy
      - name: Verify protected distribution
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/logo.webp
          test -s dist/icon.svg
          test -s dist/LICENSE
          test ! -d dist/supabase
          test ! -d dist/.github
          test ! -d dist/scripts
          test ! -f dist/package.json
          test ! -f dist/package-lock.json
          test "$(find dist -type f | wc -l | tr -d ' ')" = "6"
          ! find dist -type f -name '*.map' | grep .
          ! grep -R -E 'sourceMappingURL=|SUPABASE_SERVICE_ROLE_KEY|sb_secret_[A-Za-z0-9_-]+' dist
      - name: Upload protected distribution
        uses: actions/upload-artifact@v4
        with:
          name: super-tudo-protegido
          path: dist/
          if-no-files-found: error
          retention-days: 14
