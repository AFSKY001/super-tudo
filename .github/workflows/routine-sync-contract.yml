name: Validate routine and sync permissions

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/check-sync-contract.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/routine-sync-contract.yml"

permissions:
  contents: read

concurrency:
  group: routine-sync-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Validate synchronization and routine contracts
        run: npm run check:sync
