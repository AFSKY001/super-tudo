name: Test pinned Wrangler candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wrangler-candidate.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: wrangler-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and pin Wrangler candidate
        run: npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund wrangler@4.165.0
      - name: Reinstall from generated lockfile
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Wrangler version
        run: npx wrangler --version
      - name: Validate Cloudflare configuration without publishing
        run: npx wrangler deploy --dry-run
      - name: Run protected distribution checks
        run: npm run build:deploy
      - name: Verify committed distribution is unchanged
        run: git diff --exit-code -- dist/
      - name: Generate candidate dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit-candidate.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-candidate.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Candidate npm audit:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via}));
          }
          NODE
      - name: Commit tested Wrangler pin
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-candidate.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          if ((counts.total ?? 0) !== 0) {
            throw new Error('Wrangler candidate has npm audit findings; refusing to commit.');
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): pin tested Wrangler 4.165.0"
            git push
          else
            echo "The tested Wrangler lockfile is already committed."
          fi
      - name: Upload Wrangler candidate files and audit report
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-candidate
          path: |
            package.json
            package-lock.json
            npm-audit-candidate.json
          if-no-files-found: error
          retention-days: 7
