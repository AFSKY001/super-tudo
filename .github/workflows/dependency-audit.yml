name: Dependency security audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate full npm audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          code=$?
          echo "npm_audit_exit_code=$code" >> "$GITHUB_OUTPUT"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const lines = [
            '## npm audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical','high','moderate','low','info'].map(k => `| ${k} | ${counts[k] ?? 0} |`),
            '',
            `Total findings: **${counts.total ?? 0}**`,
            '',
            'This workflow reports findings without changing package versions or the lockfile.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({counts, advisories:Object.keys(report.vulnerabilities||{})}, null, 2));
          NODE
          exit "$code"

      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error
          retention-days: 14
