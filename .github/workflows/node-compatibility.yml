name: Test Node.js compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node.js ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Run protected production build
        run: npm run build:deploy

      - name: Verify protected distribution
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test "$(find dist -type f | wc -l | tr -d ' ')" = "6"
          ! find dist -type f -name '*.map' | grep .
