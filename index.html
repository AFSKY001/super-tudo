/* ---- padrão visual unificado (tokens únicos para movimento, janelas e seções) ---- */
:root{--dur-f:.14s;--dur:.2s;--dur-s:.3s;--ease:cubic-bezier(.2,.8,.2,1);--rad:12px;--rad-sheet:16px}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
@keyframes surge{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes sobe{from{transform:translateY(100%)}}
@keyframes some{from{opacity:0}}
.an>*{animation:entra var(--dur-s) var(--ease) both}
.an>*:nth-child(2){animation-delay:.04s}.an>*:nth-child(3){animation-delay:.08s}.an>*:nth-child(4){animation-delay:.12s}.an>*:nth-child(5){animation-delay:.16s}.an>*:nth-child(n+6){animation-delay:.2s}
.an.dr>*,.an.dl>*{animation-duration:.4s}
.sheet{max-width:760px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;animation:sobe var(--dur-s) var(--ease) both}
.dd,.balloon,.nbx,.lgc{animation:surge var(--dur) var(--ease) both}
.dim{animation:some var(--dur) both}
.c,details{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);padding:12px;margin:8px 0}
details{padding:10px 12px}
summary{font-weight:700;cursor:pointer;list-style:none;padding:2px 0}
summary::-webkit-details-marker{display:none}

button,.c,.ch,.day{transition:transform var(--dur-f),background var(--dur),color var(--dur),box-shadow var(--dur),filter var(--dur)}
button:active{transform:scale(.96)}
.c[onclick]:active{transform:scale(.985)}
h2{font-size:16px;margin:14px 4px 6px}h3{font-size:14px;margin:0 0 6px}h4{font-size:13px;margin:12px 0 4px;color:var(--pr)}

.u-mt6{margin-top:6px}.u-mt8{margin-top:8px}.u-mt10{margin-top:10px}.u-mv6{margin:6px 0}.u-mv8{margin:8px 0}.u-m10{margin:10px 4px 4px}.u-fx1{flex:1;margin:0;min-width:0}.u-wauto{width:auto;margin:0}

/* botões de cabeçalho */

/* cartões e listas */

/* botões */

.b{border-radius:6px;padding:2px 8px;font-weight:600}.b.ok{background:var(--oks)}.b.no{background:var(--nos)}.b.wa{background:var(--was)}

/* campos */
input,select,textarea{border-radius:var(--r-s);background:var(--cd);padding:10px 11px;font:15px var(--fn);transition:border-color var(--dur-f),box-shadow var(--dur-f)}

.sn button{border-radius:var(--r-s);background:var(--cd)}.sn .a.on{background:var(--mu)}
.rt button{border-radius:var(--r-s);background:var(--cd)}.rt button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.day{border-radius:var(--r-m);padding:7px 0}.day.on,.month-cell.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.month-cell{background:var(--cd)}

/* indicadores */
.bar{height:6px;border-radius:6px}.bar i{border-radius:6px;transition:width .5s var(--ease)}
.cols{height:128px;gap:8px}.cols i{border-radius:5px 5px 2px 2px}
.stk{height:22px;border-radius:7px}

/* navegação: barra inferior (celular e tablet) */
nav{background:var(--cd);border-top:1px solid var(--bd);box-shadow:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

/* trilho de Registros */

.rail .rb .ic{width:20px;height:20px}
.rail .rb.on{background:var(--prs);color:var(--pr);border-color:var(--pr)}
.balloon{border-radius:var(--r-m);box-shadow:var(--sh2)}.balloon button{background:none}.balloon button.on{background:var(--prs);color:var(--pr);font-weight:600}

/* menus, janelas e login */
.dim{background:rgba(16,24,40,.5)}
.dd{border-radius:var(--r-m);box-shadow:var(--sh2);padding:6px}.dd button{border-radius:var(--r-s);padding:11px 12px;font:14px var(--fn)}.dd button:hover{background:var(--sf)}
.sheet{border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;padding-top:12px}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
.nbx{border-radius:var(--r-l);box-shadow:var(--sh2)}
.lgc{border-radius:var(--r-l);box-shadow:var(--sh2);padding:26px}
.lgt{width:52px;height:52px;border-radius:14px;margin:0 auto 8px;font-size:0}.lgt .ic{width:28px;height:28px}
.spin{border-width:3px}

/* interação (só onde há mouse) */
@media(hover:hover){.c[onclick]:hover,.c.tap:hover{border-color:color-mix(in srgb,var(--pr) 45%,var(--bd));box-shadow:var(--sh2)}.bt:hover{filter:none;box-shadow:var(--sh1);background:color-mix(in srgb,var(--pr) 90%,#000)}.bt.g:hover{background:var(--sf)}.bt.d:hover{background:color-mix(in srgb,var(--no) 14%,var(--cd))}.ch:hover{background:var(--sf)}.ch.on:hover{background:var(--prs)}.rail .rb:hover,nav button:hover{background:var(--sf)}.dots:hover{background:var(--sf)}}

/* tablet */
@media(min-width:700px){header,main{max-width:880px}header{padding:20px 24px 8px}main{padding:8px 24px}.g2{gap:14px}.c,details{padding:16px}}

/* computador: menu lateral */

header,main{max-width:1040px;margin-left:auto;margin-right:auto}header{padding:28px 32px 8px}main{padding:8px 32px}
header h1,header p::before{display:none}header p{margin:0;font-size:22px;font-weight:700;color:var(--tx);letter-spacing:-.4px}
.dd{right:32px}.nbx{left:auto;right:32px;width:440px}

/* =====================================================================
   TEMA SUAVE (v5) — cartões amplos, sombras suaves, degradê azul-violeta,
   menu em pílula. Inspirado nas referências enviadas.
   ===================================================================== */
:root{--pr:#3b63f2;--vi:#6a4bff;--prs:#e8eeff;--grad:linear-gradient(135deg,#3f80ff 0%,#5a3df0 100%);--bg:#e9eef8;--cd:#fff;--tx:#141b34;--mu:#6b7490;--bd:#e3e8f4;--sf:#eef2fa;--r-s:12px;--r-m:16px;--r-l:22px;--rad:22px;--sb:256px;
--sh1:0 2px 6px rgba(52,72,140,.06),0 8px 22px rgba(52,72,140,.08);--sh2:0 4px 10px rgba(52,72,140,.08),0 18px 40px rgba(52,72,140,.16);--glow:0 6px 16px rgba(70,80,240,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr:#6f95ff;--vi:#9a86ff;--prs:#1b2547;--grad:linear-gradient(135deg,#4a86ff,#6a4bff);--bg:#0a0f24;--cd:#131a36;--tx:#e8ecff;--mu:#97a0c4;--bd:#222b50;--sf:#1a2244;--sh1:0 2px 6px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);--sh2:0 4px 10px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);--glow:0 6px 18px rgba(90,80,255,.4)}}
:root[data-theme="dark"]{--pr:#6f95ff;--vi:#9a86ff;--prs:#1b2547;--grad:linear-gradient(135deg,#4a86ff,#6a4bff);--bg:#0a0f24;--cd:#131a36;--tx:#e8ecff;--mu:#97a0c4;--bd:#222b50;--sf:#1a2244;--sh1:0 2px 6px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);--sh2:0 4px 10px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);--glow:0 6px 18px rgba(90,80,255,.4)}
body{padding-bottom:112px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 420px at 90% -8%,rgba(106,75,255,.14),transparent 65%),radial-gradient(640px 420px at -10% 2%,rgba(63,128,255,.16),transparent 65%)}
.logo,.lgt{background:var(--grad);color:#fff;box-shadow:var(--glow);border-radius:12px}
.dots{border:0;border-radius:14px;box-shadow:var(--sh1)}
h2{font-size:16px;margin:24px 4px 10px}
.big{font-size:30px}

/* cartões */
.c,details{border:1px solid color-mix(in srgb,var(--bd) 45%,transparent);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh1)}
.c.nw{border-left:4px solid var(--vi)}
.g2{gap:12px}.g2 .c{border-radius:20px;padding:16px}
.it{border-top-color:color-mix(in srgb,var(--bd) 70%,transparent)}
details{padding:6px 16px}

/* botões e filtros */
.bt{background:var(--grad);color:#fff;border:0;border-radius:14px;padding:11px 18px;box-shadow:var(--glow)}
.bt.g{background:var(--cd);color:var(--tx);box-shadow:var(--sh1)}
.bt.d{background:var(--nos);color:var(--no);box-shadow:none}
.ch{border-radius:999px;padding:8px 14px;background:var(--cd);border-color:transparent;box-shadow:var(--sh1)}
.ch.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.b{border-radius:999px;padding:3px 10px}
.sn button{border-radius:12px;border-color:transparent;background:var(--sf)}
.rt button{border-radius:12px;border-color:transparent;background:var(--sf)}
.rt button.on,.day.on,.month-cell.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.day{border-radius:16px;border-color:transparent;box-shadow:var(--sh1)}
.month-cell{border-color:transparent;background:var(--sf);border-radius:12px}

/* campos */
input,select,textarea{background:var(--sf);border:1px solid transparent;border-radius:14px;padding:11px 13px;box-shadow:inset 0 1px 3px rgba(52,72,140,.08)}
input:focus,select:focus,textarea:focus{background:var(--cd);border-color:var(--pr)}
.dsel-b{background:var(--sf);border-color:transparent;border-radius:14px}
.dsel-p{border-radius:16px}

/* indicadores */
.bar{height:8px;border-radius:8px;background:var(--sf);box-shadow:inset 0 1px 2px rgba(52,72,140,.1)}
.bar i{background:linear-gradient(90deg,#3f80ff,#6a4bff);border-radius:8px}

/* menu inferior flutuante (celular e tablet) */
nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-width:none;border:0;border-radius:26px;padding:6px;box-shadow:var(--sh2)}

nav button.on .ni{background:var(--grad);color:#fff;box-shadow:var(--glow)}

/* trilho de Registros */
.rail .rb{border-radius:16px;border-color:transparent;box-shadow:var(--sh1)}
.rail .rb.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.balloon{border-radius:18px}.balloon button{border-radius:12px}.balloon button.on{background:var(--grad);color:#fff}

/* janelas */
.dd{border-radius:18px}.dd button{border-radius:12px}
.sheet{border-radius:28px 28px 0 0}
.nbx{border-radius:22px}
.lgc{border-radius:28px;padding:28px}.lgt{width:56px;height:56px;border-radius:16px}

@media(hover:hover){.c[onclick]:hover,.c.tap:hover{border-color:transparent;box-shadow:var(--sh2);transform:translateY(-1px)}.bt:hover{background:var(--grad);filter:brightness(1.08);box-shadow:var(--glow)}.ch.on:hover,.nav button.on:hover{background:var(--grad)}.rail .rb.on:hover,nav button.on:hover{background:none}.rail .rb.on:hover{background:var(--grad)}}

@media(min-width:1024px){

}

button.ibtn:hover{filter:brightness(1.06)}

/* ---- Super Tudo Motion System v1: movimentos consistentes e leves ---- */
:root{
 --motion-fast:140ms;
 --motion-base:220ms;
 --motion-enter:280ms;
 --ease-standard:cubic-bezier(.2,0,0,1);
 --ease-enter:cubic-bezier(.16,1,.3,1);
 --ease-exit:cubic-bezier(.4,0,1,1);
 --ease-emphasis:cubic-bezier(.22,1,.36,1);
}
@keyframes st-fade-in{from{opacity:0}to{opacity:1}}
@keyframes st-rise-in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes st-menu-in{from{opacity:0;transform:translate3d(0,-6px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes st-sheet-in{from{opacity:.85;transform:translate3d(0,22px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes st-modal-in{from{opacity:0;transform:translate3d(0,8px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}

/* Conteúdo: entrada curta, sem cascata longa que atrase a leitura */
.an>*{animation:st-rise-in var(--motion-enter) var(--ease-enter) both}
.an>*:nth-child(2){animation-delay:18ms}
.an>*:nth-child(3){animation-delay:36ms}
.an>*:nth-child(4){animation-delay:54ms}
.an>*:nth-child(n+5){animation-delay:0ms}
.an .bar i{animation:gr 650ms var(--ease-enter) both}
.an .cols i{animation:gh 520ms var(--ease-enter) both}
.an .rg{animation:rg 650ms var(--ease-enter) both}

/* Camadas e navegação */
.dd,.nbx{animation:st-menu-in 180ms var(--ease-enter) both;transform-origin:top right}
.sheet{animation:st-sheet-in var(--motion-enter) var(--ease-enter) both;overscroll-behavior:contain}
.dim{animation:st-fade-in 180ms ease-out both}
.balloon{animation:st-modal-in 200ms var(--ease-enter) both}
details[open]>:not(summary){animation:st-rise-in 180ms var(--ease-enter) both}

/* Resposta tátil: sem o "salto" exagerado ao tocar em qualquer botão */
button,.c,.ch,.day,.reg-menu-tile{
 transition:transform var(--motion-fast) var(--ease-standard),
 background-color var(--motion-base) var(--ease-standard),
 border-color var(--motion-base) var(--ease-standard),
 color var(--motion-base) var(--ease-standard),
 box-shadow var(--motion-base) var(--ease-standard),
 filter var(--motion-base) var(--ease-standard);
}
button:active{transform:scale(.985)}
button.ibtn:active{transform:scale(.97)}
.c[onclick]:active,.c.tap:active,.reg-menu-tile:active{transform:scale(.992)}
.bt:active{filter:brightness(.96);box-shadow:none}
button:focus-visible,.ch:focus-visible,.day:focus-visible{outline:2px solid var(--pr);outline-offset:3px}
@media(hover:hover){
 .c[onclick]:hover,.c.tap:hover,.reg-menu-tile:hover{transform:translateY(-1px)}

}
nav button .ni{transition:transform 180ms var(--ease-emphasis)}
nav button.on .ni{transform:scale(1.06)}
/* Animações nunca devem bloquear uma ação nem competir com leitura */
@media(prefers-reduced-motion:reduce){

}

/* ==========================================================
   SISTEMA DE MOVIMENTO NATIVO — Super Tudo
   Movimento curto, funcional e sem efeitos decorativos.
   ========================================================== */
:root{
  --dur-fast:150ms;
  --dur-base:220ms;
  --dur-slow:320ms;
  --ease-out:cubic-bezier(0.2,0.8,0.2,1);
  --ease-in:cubic-bezier(0.4,0,1,1);
  --ease-spring:cubic-bezier(0.34,1.3,0.64,1);
}
.pressable{
  transition-property:transform!important;
  transition-duration:var(--dur-fast)!important;
  transition-timing-function:var(--ease-out)!important;
}
.pressable:active{
  transform:scale(.96)!important;
}
/* Press-and-hold nas ações principais */
.hold-action{position:relative!important;isolation:isolate;overflow:hidden}
.hold-action>.hold-bubble{
  position:absolute;left:50%;top:50%;width:var(--hold-diameter);height:var(--hold-diameter);
  border-radius:50%;background:var(--hold-color);pointer-events:none;z-index:0;
  transform:translate(-50%,-50%) scale(0);transform-origin:center;
  transition:transform 600ms cubic-bezier(.2,.8,.2,1);
}
.hold-action>.hold-bubble.is-growing{transform:translate(-50%,-50%) scale(1)}
.hold-action>.hold-bubble.is-receding{
  transform:translate(-50%,-50%) scale(0);
  transition-duration:150ms;
}
.hold-action>*:not(.hold-bubble){position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){
  .hold-action>.hold-bubble{transition:none!important}
}
@media (prefers-reduced-motion:reduce){

    --dur-fast:0ms;
    --dur-base:0ms;
    --dur-slow:0ms;
  }
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    transform:none!important;
    scroll-behavior:auto!important;
  }

 let h='<div class="row sp"><div><h3 style="margin:0">'+(admin?'Acompanhamento dos cronogramas':'Meu cronograma')+'</h3><div class="mu">'+(admin?'Acompanhe a execução por funcionário e por dia.':'Marque as atividades que você concluiu. Você não pode alterar as atividades do modelo.')+'</div></div></div>';

 }else{

 }
 const all=stats(dt);
 h+='<div class="c"><div class="row sp"><b>'+DN[dow(dt)]+', '+br(dt)+'</b><span class="mu">'+all.done+'/'+all.total+' concluídas</span></div>'+bar(all.total?all.done/all.total*100:0)+'</div>';
 if(admin){
  const groups=active.map(p=>({p,t:tasksFor(p,dt)})).filter(x=>x.t.length);
  h+=groups.length?groups.map(({p,t})=>{const n=t.filter(x=>pdn(dt,x,p)).length;return '<div class="c"><div class="row sp"><b>'+esc(p.n)+'</b><span class="mu">'+n+'/'+t.length+' concluídas</span></div>'+bar(t.length?n/t.length*100:0)+t.map(x=>{const d=pdn(dt,x,p);return '<div class="it"><span>'+(d?'✓':'○')+'</span><div style="'+(d?'opacity:.6;text-decoration:line-through':'')+'"><b>'+esc(x.t)+'</b><div class="mu">'+(x.r||[]).map(esc).join(' · ')+(x.time?' · '+esc(x.time):'')+'</div></div><span class="b '+(d?'ok':'wa')+'">'+(d?'Feito':'Pendente')+'</span></div>'}).join('')+'</div>'}).join(''):'<div class="c mu">Nenhuma atividade prevista para este dia e filtro.</div>';
 }else{

  h+='<div class="c"><h3>Adicionar atividade ao meu cronograma</h3><p class="mu">A atividade será acrescentada à sua rotina e também ficará visível para o administrador acompanhar. Isso não altera o modelo que foi atribuído a você.</p><label>Nome da atividade<input id="ptn_'+self.id+'" placeholder="Descreva o que você precisa fazer"></label><div class="week-picks u-g2 u-mt6">'+tmDaysHTML('ptnd_'+self.id,[dow(dt)])+'</div><div class="row u-mt6"><input id="pth_'+self.id+'" type="time" class="u-fx1"><button class="bt" onclick="ptAdd(\''+self.id+'\')">Adicionar atividade</button></div></div>';
 }
 return h;
}
const TM_DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const tmDaysHTML=(pre,sel)=>TM_DAYS.map((d,i)=>`<label class="u-row-c" style="margin:0"><input type="checkbox" name="${pre}" value="${i}" ${sel.includes(i)?'checked':''} class="u-wauto">${d}</label>`).join('');

function movImport(){const i=document.createElement('input');i.type='file';i.accept='.csv,.xlsx,.xls';i.onchange=()=>{const f=i.files[0];if(!f)return;readRows(f,rows=>{
 const pick=(r,...ks)=>{const key=Object.keys(r).find(x=>ks.includes(nrm(x)));return key!==undefined?r[key]:''};

 rows.forEach((r,idx)=>{const linha=idx+2,c=String(pick(r,'codigo','cod')||'').trim();if(!c){erros.push('linha '+linha+': código vazio');return}
  const pRaw=String(pick(r,'preco venda','preco')||'').trim(),preco=pRaw===''?null:nmv(pRaw),mot=String(pick(r,'motivo')||'').trim();
  itens.push({id:uid(),c,p:String(pick(r,'descricao')||'').trim(),bar:String(pick(r,'codigo de barras','ean')||'').trim(),emb:String(pick(r,'embalagem')||'').trim(),preco:(preco!==null&&isFinite(preco))?preco:null,mot,loja:String(pick(r,'loja')||'').trim(),fila:movFila(mot)})});
 if(!itens.length){alert('Nenhuma linha válida para importar.'+(erros.length?'\n'+erros.slice(0,5).join('\n'):''));return}

 const msg=cnt.ENT+' entrada(s) de produto · '+cnt.PRE+' alteração(ões) de preço · '+cnt.MAN+' com motivo desconhecido (classificar depois)'+(erros.length?'\n'+erros.length+' linha(s) sem código, não importadas':'')+(dup?'\n\nEsta lista já foi importada. Importar de novo?':'\n\nImportar?');
 if(!confirm(msg))return;
 const ent=itens.filter(x=>x.fila==='ENT'),pre=itens.filter(x=>x.fila==='PRE'),man=itens.filter(x=>x.fila==='MAN');
 const meta=confMetaArquivo(f,'','');
 S.conf=S.conf||[];S.movB=S.movB||[];
 if(ent.length)S.conf.push(movConfImport(ent,'ruptura','mov_ent',f,'Entrada de produto',sig));
 if(pre.length)S.conf.push(movConfImport(pre,'preco','mov_pre',f,'Alteração de preço',sig));
 if(man.length)S.movB.push({id:uid(),h:Date.now(),data:today(),arq:f.name,sig,arqRem:meta.rem,motivo:'Motivo desconhecido',dataArquivo:meta.data,arquivoOriginal:f.name,items:man,by:V.me?V.me.n:''});
 if(!save())return;alert(itens.length+' linha(s) importada(s). As listas estão em Conferências.');R()})};i.click()}

async function refreshCloudAccessLinks(){
  if(!V.cloudIdentity||V.cloudIdentity.role!=='master'||!V.cloudIdentity.org_id)return;
  const {data:members,error}=await supa.from('org_members').select('*').eq('org_id',V.cloudIdentity.org_id);
  if(error)throw error;
  const links=(Array.isArray(members)?members:[]).filter(m=>m&&m.team_member_id&&(m.user_id||m.profile_id));
  const ids=[...new Set(links.map(m=>String(m.user_id||m.profile_id)))];
  if(!ids.length)return;
  const {data:profiles,error:profileError}=await supa.from('profiles').select('*').in('id',ids);
  if(profileError)throw profileError;
  const byId=new Map((profiles||[]).map(p=>[String(p.id),p]));
  let changed=false;
  links.forEach(m=>{
    if(m.active===false||m.is_active===false)return;
    const uid=String(m.user_id||m.profile_id),memberId=String(m.team_member_id);
    const employee=(S.team||[]).find(p=>String(p.id)===memberId);
    if(!employee)return;
    const profile=byId.get(uid)||{};
    const username=String(profile.username||profile.user_name||'').trim().toLowerCase();
    if(employee.sb_uid!==uid){employee.sb_uid=uid;changed=true}
    if(username&&employee.u!==username){employee.u=username;changed=true}
  });
  if(changed)save();
}

async function createConfigSchedule(){
 try{
  const src=configScheduleSources()[V.configScheduleSourceIndex||0];if(!src)throw new Error('Selecione uma configuração válida.');
  const effective=$('cfg_sched_date')?.value;if(!effective)throw new Error('Informe a data de início.');
  const data=JSON.parse($('cfg_sched_data')?.value||'');
  if(!confirm('Programar esta nova versão para '+new Date(effective).toLocaleString('pt-BR')+'?'))return;
  const result=await configHistoryCall('create',{module:src.module,record_id:src.record_id,kind:src.kind,base_revision:Number(src.revision),data,effective_at:new Date(effective).toISOString()});
  if(!result?.ok)throw new Error(result?.error||'Não foi possível criar o agendamento.');
  alert('Mudança programada. A configuração atual continuará valendo até a data escolhida.');
  await loadConfigSchedules();
 }catch(e){alert(e.message||'Não foi possível programar a mudança.');}
}

function openFromOrigin(el,contentEl){

  if(overlay){
   clearOriginAnimations(overlay);

 if(!reduce){

async function doLogin(){
  const u=($('lg_u').value||'').trim().toLowerCase(),p=$('lg_p').value||'';
  if(!u||!p){V.lgE='Informe o usuário e a senha.';R();return;}
  V.lgL=1;V.lgE='';R();
  try{
    const res=await fetch(LOGIN_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({username:u,password:p})});
    const json=await res.json();
    if(!res.ok||!json.session||!json.profile||!json.membership){
      V.lgL=0;V.lgE=json.error||'Não foi possível validar seu acesso.';R();return;
    }
    if(!['admin','gerente','encarregado'].includes(json.membership.role)){
      V.lgL=0;V.lgE='Perfil de acesso não autorizado.';
      R();return;
    }
    const isAdmin=json.membership.role==='admin';
     const isManager=json.membership.role==='gerente';
    const teamMemberId=String(json.membership.team_member_id||'').trim();
    if(!isAdmin&&!isManager&&!teamMemberId){V.lgL=0;V.lgE='Este login ainda não está vinculado ao cadastro de um funcionário. Peça ao administrador para revisar o acesso.';R();return;}
    const auth=await supa.auth.setSession({access_token:json.session.access_token,refresh_token:json.session.refresh_token});
    if(auth.error)throw auth.error;
    V.sbSession=json.session;
    V.cloudIdentity={
      id:String(json.profile.id),
      u:json.profile.username||json.username||u,
      n:json.profile.display_name||json.profile.full_name||json.username||u,
      c:isAdmin?'Administração':isManager?'Gerência':'Encarregado',
      role:isAdmin?'master':isManager?'gerente':'encarregado',
      perm:Array.isArray(json.membership.permissions)?json.membership.permissions.filter(x=>typeof x==='string'):[],
      sb_uid:String(json.profile.id),
      org_id:json.membership.org_id,
      team_member_id:teamMemberId
    };
    syncUseIdentity();
    V.wel='cloud:'+V.cloudIdentity.id;
    localStorage.setItem('st_auth_state',JSON.stringify({version:APP_VERSION,wel:V.wel,identity:V.cloudIdentity}));
    let pullOk=true;
    try{await pullCloudTeam()}catch(syncErr){pullOk=false;console.warn('Falha ao carregar equipe da nuvem:',syncErr)}
    if(!meOf(V.wel)){
      localStorage.removeItem('st_auth_state');
      await supa.auth.signOut();
      V.sbSession=null;V.cloudIdentity=null;V.wel=null;
      V.lgL=0;
      V.lgE=pullOk?'Cadastro do funcionário não encontrado na nuvem. Peça ao administrador para conferir o cadastro.':'Não foi possível carregar seu cadastro da nuvem. Verifique a conexão e tente novamente.';
      R();return;
    }
    V.lgL=0;R();
  }catch(err){
    V.lgL=0;V.lgE='Falha na conexão. Verifique a internet.';R();
  }
}

async function pushEnsureSubscription(){
 if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)||Notification.permission!=='granted')return false;
 const pub=await pushCall('public-key');
 if(!pub?.publicKey)throw new Error('Não foi possível obter a chave de notificação.');
 const reg=await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushBase64Key(pub.publicKey)});
 const result=await pushCall('subscribe',{subscription:sub.toJSON()});
 if(!result?.ok)throw new Error('Não foi possível registrar este aparelho.');
 V.pushEnabled=true;
 return true;
}
function pushBase64Key(value){
 const s=String(value||'').replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s+'='.repeat((4-s.length%4)%4));
 return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function acessoServidor(payload) {
  const { data: { session } } = await supa.auth.getSession();

  const token = session?.access_token || V.sbSession?.access_token;

  if (!token) {
    throw new Error('Sua sessão expirou. Entre novamente como administrador.');
  }

  const body = { ...payload };

  if (body.action === 'create' || body.action === 'update') {
    body.team_member_id = String(body.team_member_id ?? '').trim();

    if (!body.team_member_id) {
      throw new Error(
        'O identificador do funcionário não foi enviado. Confira o cadastro da equipe.'
      );
    }
  }

  const res = await fetch(CREATE_USER_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify(body)
  });

  let data = {};

  try {
    data = await res.json();
  } catch (e) {}

  if (!res.ok || !data.ok) {
    throw new Error(
      data.error || 'Não foi possível concluir a operação no servidor.'
    );
  }

  return data;
}

 html+='<h3>Execução e avaliação por pessoa</h3>'+sorted.map(({x,index})=>{

}
function perfActivityAnnualHTML(people,year){
 const rows=[];
 for(let m=1;m<=12;m++){
  const key=String(year)+'-'+String(m).padStart(2,'0'),start=key+'-01',end=key+'-'+String(perfLastDay(+year,m)).padStart(2,'0');
  if(start>today())continue;
  const capped=end>today()?today():end,a=perfActivityAggregate(people,start,capped);
  rows.push({key,a});
 }
 return '<h3>Execução e qualidade mês a mês · '+year+'</h3><div class="c">'+(rows.length?rows.map(x=>'<div class="it"><div style="flex:1"><b>'+x.key.slice(5)+'/'+x.key.slice(0,4)+'</b><div class="mu">Cronograma: '+(x.a.taskPct===null?'—':x.a.taskPct.toFixed(1)+'%')+' · Checklists: '+(x.a.checkPct===null?'—':x.a.checkPct.toFixed(1)+'%')+' · Avaliação: '+(x.a.evalAvg===null?'—':x.a.evalAvg.toFixed(1)+'/10')+'</div></div></div>').join(''):'<div class="mu">Sem dados no ano.</div>')+'</div>';
}

{v:'3.31.23',d:'17/11/2026',t:'Padroniza conferências e identificação de remarcações (PATCH)',n:['Ruptura e etiqueta usam os mesmos status: ✓ colocado, ✕ não colocado e – pendente.','Após mais de dois dias com ✕, cada produto pode ser selecionado e atribuído individualmente a um responsável.','Produtos atribuídos alimentam os indicadores individuais de ruptura ou etiquetas não colocadas.','Importações de arquivos de remarcação exibem somente o nome Remarcação, o motivo e a data identificada no nome do arquivo; a data de importação fica menor e separada.'],c:[]},
{v:'3.31.22',d:'17/11/2026',t:'Identificação de autoria e proteção de direitos autorais (PATCH)',n:['Incluída a identificação de autoria no código-fonte e na interface do sistema.','Adicionado aviso de direitos autorais e licença proprietária no repositório.'],c:[]},
{v:'3.31.21',d:'17/11/2026',t:'Correções no fluxo de Conferência de pedidos (PATCH)',n:['A lista de Conferências exibe somente nome, data e símbolos de status; os produtos aparecem apenas ao abrir a lista.','Pedido para Compras segue o padrão de conferência com status comprado, não comprado ou parcialmente comprado, sem campo de quantidade comprada.','Removida a exclusão da tela Conferência; a exclusão do pedido permanece somente em Lançamentos, na função Pedido para Compras.'],c:[]},
{v:'3.31.20',d:'17/11/2026',t:'Padronização das conferências e bloqueio por atraso (PATCH)',n:['Todas as listas de Conferência mostram os produtos com símbolos padronizados: ✓ conferido/comprado, ✕ não conferido/não comprado e – pendente.','Somente Ruptura e Alteração de preço exibem o botão 🚫 após mais de dois dias; ele abre a seleção dos produtos elegíveis e do responsável.'],c:[]},
{v:'3.31.19',d:'17/11/2026',t:'Exclusão de pedidos e conferência compacta (PATCH)',n:['Adicionada exclusão do pedido junto com sua conferência vinculada.','Lista de conferências de compras mostra somente o nome dos produtos e os símbolos de comprado, não comprado ou neutro/pendente.'],c:[]},
{v:'3.31.18',d:'17/11/2026',t:'Pedido para Compras integrado à Conferência (MINOR)',n:['Pedido criado automaticamente em Conferências, com todos os produtos inicialmente pendentes.','Todos os logins de cargos de liderança podem criar, consultar e atualizar o andamento das compras.','Notificações de criação e atualização abrem diretamente a conferência do pedido.'],c:[]},
{v:'3.31.17',d:'17/11/2026',t:'Conta, recebimento de frios e padronização dos lançamentos (MINOR)',n:['Identificação da conta conectada, com nome e usuário visíveis durante o uso.','Recebimento de frios com campo para empresa fornecedora e correção do fluxo de edição do checklist.','Lançamentos com cabeçalho e cartão de inclusão padronizados, seguindo o modelo de Temperaturas.'],c:[]},
{v:'3.31.16',d:'17/11/2026',t:'Correção da sincronização na nuvem (PATCH)',n:['Removida uma declaração duplicada que impedia a rotina completa de sincronização de concluir a leitura e enviar lançamentos para a nuvem.'],c:[]},
{v:'3.31.15',d:'17/11/2026',t:'Sincronização geral na nuvem (MINOR)',n:['Lançamentos, cadastros, checklists, avaliações, cronogramas e conferências passam a entrar na fila de sincronização após alterações.','Atualizações de outros aparelhos são baixadas automaticamente, com atualização ao reconectar e verificação periódica.','Alterações pendentes ficam preservadas no aparelho; conflitos não sobrescrevem dados silenciosamente.'],c:[]},
{v:'3.31.14',d:'16/11/2026',t:'Exibição do login administrador (PATCH)',n:['Administradores vinculados à equipe passam a aparecer em Acessos e logins, em seção somente leitura.']},
{v:'3.31.13',d:'16/11/2026',t:'Padronização geral de layout (MINOR)',n:['Todas as áreas passam a usar a mesma estrutura externa de página, com título, descrição, largura, espaçamento e hierarquia visual consistentes.','A padronização é apenas visual: ações, permissões, dados e fluxos existentes foram preservados.'],c:[]},
{v:'3.31.12',d:'16/11/2026',t:'Correção da ordem do cabeçalho de perdas (PATCH)',n:['Perdas de perecíveis: título e botão de importar aparecem no topo, antes dos indicadores, seguindo o padrão das demais telas.'],c:[]},
{v:'3.31.11',d:'16/11/2026',t:'Padronização de perdas de perecíveis (PATCH)',n:['Lançamentos: tela de perdas de perecíveis segue o padrão dos demais menus, com nome do menu no topo e botão + para importar planilha.'],c:[]},
{v:'3.31.10',d:'16/11/2026',t:'Atualização de versão para disparar nova publicação (PATCH)',n:['Versão incrementada sem alterar funcionalidades do sistema.'],c:[]},
{v:'3.31.9',d:'16/11/2026',t:'Sincronização inicial da equipe (PATCH)',n:['Login: carrega os cadastros de funcionários autorizados pela nuvem antes de abrir o sistema.','Sessão: atualiza a equipe ao restaurar o login e mantém os dados locais disponíveis quando estiver offline.'],c:[]},
{v:'3.31.8',d:'15/11/2026',t:'Vínculo do login com a equipe (PATCH)',n:['Login: encarregado passa a ser associado ao cadastro correto da equipe pelo team_member_id retornado pelo Supabase.','Login: impede entrada de encarregado sem vínculo com um cadastro da equipe.'],c:[]},
{v:'3.31.5',d:'15/11/2026',t:'Correção de permissões (PATCH)',n:['Permissões: menu Equipe alinhado à chave r:eqp usada pelo perfil e pelo Supabase.'],c:[]}, 
{v:'3.31.4',d:'15/11/2026',t:'Correções e melhorias (PATCH)',n:['Login: a sessão permanece ativa ao atualizar ou reabrir a página; uma nova versão do código solicita autenticação novamente.','Login: corrigido erro que impedia abrir o sistema quando um elemento opcional não existia.','Registros: menus transferidos para Lançamentos não reaparecem duplicados na barra lateral ao abrir suas telas.'],c:[]},
{v:'3.31.3',d:'07/11/2026',t:'Ajuste (PATCH)',n:['Progresso: o botão Recolher saiu. Tocar no painel aberto recolhe o funcionário; botões, campos e seletores dentro do painel não recolhem.'],c:[]},
{v:'3.31.2',d:'07/11/2026',t:'Correção (PATCH)',n:['Progresso: uma só lista de funcionários. O painel completo de desempenho abre dentro da própria linha do funcionário, com botão Recolher. Removido o painel duplicado que ficava embaixo da lista.'],c:[]},
{v:'3.31.1',d:'07/11/2026',t:'Correção (PATCH)',n:['Progresso: removida a lista duplicada de funcionários. A seção Por funcionário que já existia agora abre o painel de desempenho ao tocar; só um fica aberto por vez.'],c:[]},
{v:'3.31.0',d:'07/11/2026',t:'Mudança (MINOR)',n:['Desempenho saiu da ficha do funcionário e foi para Progresso. Em Progresso, cada funcionário tem um resumo (nota e checklists); ao tocar, abre o painel completo, e só um fica aberto por vez, com botão para recolher.'],c:[]},
{v:'3.30.0',d:'07/11/2026',t:'Padronização (MINOR)',n:['Ruptura e Alteração de preço (etiquetas) funcionam do mesmo jeito: marque os produtos que passaram de 2 dias fora da prateleira e escolha o funcionário em Adicionar ao funcionário. O responsável embaixo de cada produto e o botão 🚫 saíram. Tudo é gravado só ao apertar Salvar.'],c:[]},
{v:'3.29.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Conferências de Ruptura e de Etiquetas (alteração de preço): as marcações ✓ ✗ – 🚫 e o responsável de cada produto ficam como rascunho até apertar Salvar. Salvar aplica tudo de uma vez (status, registros de ruptura e avisos de etiqueta). Cancelar descarta. Voltar com alterações pendentes pergunta antes de descartar.'],c:['Ao sair pelo menu, sem usar Voltar, o rascunho é descartado sem aviso.']},
{v:'3.28.0',d:'07/11/2026',t:'Remoção (MINOR)',n:['Função Transformação removida do aplicativo: sai dos menus, dos setores e das sugestões de modelos. Os registros históricos de Transformação foram preservados.'],c:[]},
{v:'3.27.0',d:'07/11/2026',t:'Simplificação (MINOR)',n:['Movimentações voltou a ser simples: importa a lista e separa em Entrada de produto (ruptura) e Alteração de preço (etiquetas). Cada parte vai para Conferências, onde a conferência é feita. A entrega de etiqueta voltou como antes, com o resumo do mês. Motivo desconhecido fica em Classificar.'],c:['Listas antigas de Movimentações foram enviadas para Conferências, com status preservado.']},
{v:'3.26.0',d:'07/11/2026',t:'Correção estrutural (MINOR)',n:['Ruptura e Etiquetas unificadas em Movimentações: Ruptura vira Entrada de produtos e Etiquetas vira Alteração de preços. Movimentações fica em Lançamentos e sai da lateral de Registros. Conferências antigas de Ruptura e Etiquetas foram migradas para lotes de Movimentações, com status, responsável e data preservados. Os registros históricos e os indicadores antigos foram mantidos.'],c:['Quem tinha acesso a Ruptura ou Etiquetas agora vê Movimentações.','Notificações antigas que apontavam para conferências de Ruptura ou Etiquetas deixam de abrir o registro.']},
{v:'3.25.1',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Movimentações: filtros por situação, loja e funcionário dentro do lote, e resumo de conferências por funcionário.'],c:[]},
{v:'3.25.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Novo menu Registros › Movimentações: importação de planilha de remarcação (Código, Descrição, Código de Barras, Embalagem, Preço Venda, Motivo e Loja). ENTRADA vai para conferência de recebimento (recebido ou não, quantidade recebida, divergência). PRECO ALTERADO, INICIO OFERTA e TERMINO OFERTA vão para conferência de preços (sistema, gôndola, etiqueta e oferta aplicada/encerrada). Motivo desconhecido fica em Classificar. Conferência item a item, com Salvar e Cancelar.'],c:['Integração com a base de Estoque ainda não feita (projeto guardado).']},
{v:'3.24.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Histórico de produto: busca por código ou descrição em Vencidos e Avariados. Ao abrir um produto, aparecem os dados, o último custo, os totais (vencido, avariado e valor acumulado), os motivos mais frequentes, a evolução por mês e todas as ocorrências, com a lista de origem e o responsável.'],c:['Produtos são unidos pelo código. Registros sem código não são unidos automaticamente.']},
{v:'3.23.7',d:'07/11/2026',t:'Padronização (PATCH)',n:['Listas importadas (Vencidos, Avariados, Ruptura, Etiquetas e Produtos sem Venda) seguem o mesmo padrão: a exclusão da lista fica na própria lista, e dentro da lista cada produto tem sua linha compacta com ✕.'],c:[]},
{v:'3.23.6',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Listas importadas em Lançamentos (Vencidos, Avariados, Ruptura e Etiquetas) podem ser excluídas inteiras ou produto a produto. Em Ruptura e Etiquetas, excluir a lista também exclui a conferência dela.'],c:['Importações de Produtos sem Venda mantêm o histórico de totais.']},
{v:'3.23.5',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Produtos sem venda: dentro de uma lista é possível excluir a lista (com a conferência dela) ou excluir um produto, que sai da lista e da conferência. O histórico de totais das importações é mantido.'],c:[]},
{v:'3.23.4',d:'07/11/2026',t:'Correção (PATCH)',n:['Alteração de preço e Ruptura: o preço da planilha aparece em cada produto da conferência. Não há campo de preço para digitar; a pessoa marca só ✓ ou ✗. Removido o campo de preço encontrado e o resumo de divergência de valor.'],c:[]},
{v:'3.23.3',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Alteração de preço e Ruptura: além de confirmar se o produto está na prateleira, o funcionário informa o preço encontrado. Se for diferente do preço da planilha, aparece o aviso e o resumo mostra quantos produtos estão com valor diferente.'],c:['A presença (✓ ✗ –) continua igual; a divergência de preço não muda o status do produto.']},
{v:'3.23.2',d:'07/11/2026',t:'Correção (PATCH)',n:['Vencidos e avariados: a tela mostra só as listas de importação, sem botão + Novo registro, como definido anteriormente. Colunas aparecem no topo, e o tipo (com ou sem troca) aparece em cada produto.'],c:[]},
{v:'3.23.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Vencidos e avariados organizados por importação: cada planilha vira uma lista com data, hora, arquivo, quantidade e total. Ao abrir uma lista, aparecem só os seus produtos, com seleção por checkbox (inclusive selecionar todos) e Atribuir responsável em lote. Cada atribuição guarda o responsável anterior, quem alterou e quando. Produtos de importações anteriores ficam em Importações anteriores.'],c:['Valores de quantidade, custo e total não são alterados pela atribuição.']},
{v:'3.22.3',d:'07/11/2026',t:'Correção (PATCH)',n:['Login criado para o funcionário Junior: usuário junior, senha 1234, com perfil de acesso Encarregado. A função do cadastro (Prevenção de perdas) não foi alterada. Criado uma única vez; a senha pode ser trocada depois.'],c:[]},
{v:'3.22.2',d:'07/11/2026',t:'Correção (PATCH)',n:['Setores: a edição do nome atualiza a tela depois da alteração (corrige o erro que impedia a edição no navegador). Nomes repetidos são bloqueados ignorando maiúsculas, acentos e espaços.','Conferências: removido o botão Excluir da tela de conferência. A exclusão de conferência não é mais acessível por essa tela.'],c:[]},
{v:'3.22.1',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Conferência de Produtos sem Venda no padrão de Ruptura e Alteração de Preço: sem valores em reais; cada produto com ✓ Conferido, ✗ Não conferido (com a quantidade que você tem) ou – Pendente; resumo com barra de progresso. Salvar e Cancelar: nada é gravado ao apenas voltar.'],c:['A conferência deixou de salvar automaticamente.']},
{v:'3.22.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Produtos sem venda: cada importação gera uma lista com data, horário, arquivo, quantidade e total, e uma conferência própria em Conferências. Produto que volta numa importação nova sai das listas antigas. Histórico de totais permanente, com indicador de evolução (redução é resultado positivo). Conferência com ✓ Conferido, ✗ Não confere (com quantidade encontrada) e – Pendente, salvamento automático.'],c:['A contagem deixou de existir dentro da lista; ela é feita na conferência.']},
{v:'3.21.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Produtos sem venda: novo módulo para administradores, dentro de Registros › Lançamentos. Importa a planilha (Custo c/ Imposto e Total Custo guardados como vieram), guarda cada importação como lote com histórico, e faz a conferência física: valor conferido = quantidade contada × custo unitário, separado do total original. Salvar e Cancelar.'],c:[]},
{v:'3.20.1',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Lançamentos: o campo Motivo sugere todos os motivos cadastrados, inclusive os criados pelas importações. O campo continua aceitando um motivo novo digitado.'],c:[]},
{v:'3.20.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Importação de perdas de perecíveis: motivo novo não é mais rejeitado. Ele é cadastrado automaticamente e aparece nos indicadores por motivo, junto com os motivos padrão.'],c:['Motivos padrão continuam como estão; a comparação ignora maiúsculas, acentos e espaços.']},
{v:'3.19.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Importação de vencidos e avariados: motivos novos são cadastrados automaticamente, sem rejeitar a linha. Motivos iguais escritos de forma diferente (maiúsculas, acentos, espaços) são reconhecidos como o mesmo e mantêm a grafia já cadastrada.','Nomes de colunas equivalentes aceitos: Total custo, Total c/imposto, Custo c/imposto. O total do arquivo é usado como veio, sem recálculo.'],c:[]},
{v:'3.18.1',d:'07/11/2026',t:'Correção (PATCH)',n:[],c:['Importação de vencidos e avariados: a coluna de código tem prioridade; a coluna Produto é usada como código só quando não há coluna de código.']},
{v:'3.18.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Importação de vencidos e avariados com as seis colunas do arquivo: Produto (código), Descrição, Quantidade, Custo c/ Imposto, Total c/ Imposto e Motivo. Mostra a conferência antes de gravar, ignora linhas já importadas e registra o histórico de cada importação.'],c:['O total do arquivo é usado quando vem preenchido; só é calculado quando está vazio.']},
{v:'3.17.1',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Análise de perdas: comparativo por setor em barras, com o valor de cada setor no mês.'],c:[]},
{v:'3.17.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Análise de perdas: resumo de Pareto (quantos motivos concentram o valor perdido) e detalhamento: ao tocar em um motivo, aparecem os registros que formam aquele número.'],c:['Padronização de motivos e análise por funcionário ficam para quando as regras forem definidas.']},
{v:'3.16.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Exclusão de modelos fora das telas de edição: checklist, cronograma e tipo de avaliação agora têm ✕ na lista, com confirmação em dois toques. A edição fica só com Salvar e Cancelar.'],c:['Tipo de avaliação com histórico continua sendo arquivado, não apagado. Tipos padrão não podem ser excluídos.']},
{v:'3.15.2',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Alteração de cadastro de funcionário gera notificação para a pessoa, que abre o cadastro ao tocar. A notificação só é criada quando você salva, não em ações automáticas.'],c:[]},
{v:'3.15.1',d:'07/11/2026',t:'Correção (PATCH)',n:['Conferências: a tela abre mostrando todos os tipos, para que pedidos de compra não fiquem escondidos. Pedidos pendentes que ainda não foram encaminhados aparecem na lista, com status.'],c:[]},
{v:'3.15.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Notificações abrem o registro relacionado: pedido, conferência, checklist, funcionário ou cronograma. Se o registro não existir mais, aparece uma mensagem clara.'],c:['Notificações antigas, sem destino, continuam apenas como aviso.']},
{v:'3.14.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Topo de Avaliação e de Setores/Funções segue o mesmo padrão dos demais menus: cartão com botões e descrição.'],c:[]},
{v:'3.13.0',d:'07/11/2026',t:'Melhoria (MINOR)',n:['Pedidos para Compras saiu do menu lateral de Registros e fica dentro de Registros › Lançamentos. Funções, permissões e registros foram preservados.'],c:[]},
{v:'3.12.8',d:'07/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: o arquivo compartilhado usa nome .txt e tipo text/plain, o mesmo formato que o sistema de cotação já envia. O conteúdo é JSON. A importação de envios aceita esse arquivo. O Baixar continua salvando .json.']},
{v:'3.12.7',d:'07/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: o arquivo é enviado com tipo text/plain e nome .json, porque o compartilhamento do navegador recusa application/json. O conteúdo não muda; o Baixar continua com application/json.']},
{v:'3.12.6',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: quando o navegador recusa com NotAllowedError, a mensagem orienta a baixar o arquivo e anexá-lo no WhatsApp.']},
{v:'3.12.5',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: quando o aparelho recusa o compartilhamento, a mensagem mostra o nome e a descrição do erro para diagnóstico.']},
{v:'3.12.4',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: removido o botão Abrir WhatsApp. O compartilhamento abre a tela de compartilhar do aparelho com o arquivo .json.']},
{v:'3.12.3',d:'06/11/2026',t:'Correção (PATCH)',n:['Compartilhar arquivo: quando o navegador do aparelho não compartilha arquivos, a mensagem informa o motivo e há o botão Abrir WhatsApp para chegar à conversa.'],c:[]},
{v:'3.12.2',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Compartilhar arquivo: o envio só é confirmado pelo botão Confirmar envio. Concluir o compartilhamento não marca mais os registros como enviados. O arquivo é enviado sem texto junto, para evitar rejeição por aplicativos.']},
{v:'3.12.1',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Excluir funcionário saiu da ficha da pessoa e passou para a lista de Equipe, com ✕ em cada funcionário e confirmação em dois toques.']},
{v:'3.12.0',d:'06/11/2026',t:'Melhoria (MINOR)',n:['Botões padronizados: adicionar usa o símbolo +, voltar usa a seta ‹ e excluir usa o X. Salvar, Cancelar e as confirmações permanecem com o texto original.'],c:[]},
{v:'3.11.0',d:'06/11/2026',t:'Melhoria (MINOR)',n:['Equipe: o topo de cadastro segue o mesmo padrão dos lançamentos, com cartão, botão principal e descrição.'],c:[]},
{v:'3.10.1',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Código não utilizado removido (funções e constante sem chamadas). Falha ao gravar os dados agora é informada; mensagens de sucesso só aparecem quando a gravação funcionou.']},
{v:'3.10.0',d:'06/11/2026',t:'Melhoria (MINOR)',n:['Funcionários com nome completo igual não podem ser cadastrados: a comparação ignora maiúsculas, acentos e espaços extras. Ao editar, o próprio cadastro não conta como duplicidade. Ao carregar dados da loja, nomes duplicados são avisados sem alterar nada.'],c:[]},
{v:'3.9.2',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Indicadores: o registro é atribuído pelo ID do funcionário quando existe. A atribuição pelo nome só acontece se o nome for único no cadastro, evitando misturar registros de pessoas com o mesmo nome. Registros sem responsável não entram na contagem.']},
{v:'3.9.1',d:'06/11/2026',t:'Correção (PATCH)',n:[],c:['Barra de progresso da conferência: itens sem resposta são pendentes e não contam como concluídos. A barra só chega a 100% quando não há pendentes. Colocados, não colocados e pendentes aparecem separados.']},
{v:'3.9.0',d:'06/11/2026',t:'Melhoria (MINOR)',n:['Checklist de recebimento (inclusive frios): responsável e pelo menos uma temperatura passam a ser obrigatórios para salvar.'],c:[]},

  },true);

  document.addEventListener('click',event=>{
    const action=getAction(event.target);
    if(action&&blockedClicks.has(action)){
      blockedClicks.delete(action);
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if(!event.isTrusted)return;
    if(action)vibrate();
  },true);
})();

</script>
<script>
if('serviceWorker' in navigator){
  // Se um Service Worker novo assumir uma página já controlada, recarrega
  // para carregar o HTML da versão atual. A primeira instalação não provoca reload.
  let refreshing=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||refreshing)return;
    refreshing=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
      // Confere imediatamente se existe uma versão mais recente do Service Worker.
      await registration.update();
    }catch(e){
      console.warn('Não foi possível verificar atualização do aplicativo offline:',e);
    }
  });
}
</script>
