.an>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.05s}.an>*:nth-child(3){animation-delay:.1s}.an>*:nth-child(4){animation-delay:.15s}.an>*:nth-child(5){animation-delay:.2s}.an>*:nth-child(n+6){animation-delay:.25s}
.an .bar i{animation:gr .9s cubic-bezier(.2,.8,.2,1) both}.an .cols i{transform-origin:bottom;animation:gh .7s cubic-bezier(.2,.8,.2,1) both}.an .rg{animation:rg 1s .1s cubic-bezier(.2,.8,.2,1) both}
button:active{transform:scale(.95)}.c[onclick]{cursor:pointer}.c[onclick]:active{transform:scale(.985)}

.an.dr>*{animation:pgR .45s cubic-bezier(.2,.8,.2,1) both}

@keyframes pgR{from{opacity:0;transform:translateX(34px)}}

.c[onclick]:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bt:hover{filter:brightness(1.06);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.balloon{animation:pop .22s cubic-bezier(.2,.8,.2,1) both}

details[open]>:not(summary){animation:up .22s ease both}

/* ---- padrão visual unificado (tokens únicos para movimento, janelas e seções) ---- */
:root{--dur-f:.14s;--dur:.2s;--dur-s:.3s;--ease:cubic-bezier(.2,.8,.2,1);--rad:12px;--rad-sheet:16px}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
@keyframes surge{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes sobe{from{transform:translateY(100%)}}
@keyframes some{from{opacity:0}}
.an>*{animation:entra var(--dur-s) var(--ease) both}
.an>*:nth-child(2){animation-delay:.04s}.an>*:nth-child(3){animation-delay:.08s}.an>*:nth-child(4){animation-delay:.12s}.an>*:nth-child(5){animation-delay:.16s}.an>*:nth-child(n+6){animation-delay:.2s}
.an.dr>*,.an.dl>*{animation-duration:.4s}
.sheet{border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;animation:sobe var(--dur-s) var(--ease) both}
.dd,.balloon,.nbx,.lgc{animation:surge var(--dur) var(--ease) both}
.dim{animation:some var(--dur) both}
.c,details{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);padding:12px;margin:8px 0}
details{padding:10px 12px}
summary{cursor:pointer;list-style:none;padding:2px 0}
summary::-webkit-details-marker{display:none}
details[open]>:not(summary){animation:entra var(--dur) var(--ease) both}
button,.c,.day{transition:transform var(--dur-f),background var(--dur),color var(--dur),box-shadow var(--dur),filter var(--dur)}
button:active{transform:scale(.96)}

/* ---- utilitários de espaçamento (padrão) ---- */
.u-mt6{margin-top:6px}.u-mt8{margin-top:8px}.u-mt10{margin-top:10px}.u-mv6{margin:6px 0}.u-mv8{margin:8px 0}.u-m10{margin:10px 4px 4px}.u-fx1{flex:1;margin:0;min-width:0}.u-wauto{width:auto;margin:0}

/* ---- layout padrão (linhas, grades, alinhamentos, tamanhos) ---- */
.u-row-c{display:flex;gap:8px;align-items:center;color:var(--tx)}.u-mt4{margin-top:4px}.u-mt12{margin-top:12px}.u-mb4{margin-bottom:4px}.u-mt8b{margin:8px 0 2px}.u-py4{padding:4px 0}
.u-g2{display:grid;grid-template-columns:1fr 1fr}.u-g4{display:grid;grid-template-columns:repeat(4,1fr)}
.u-tc{text-align:center}.u-tl{text-align:left}.u-gap14{gap:14px}.u-ml6{margin-left:6px}.u-ml8{margin-left:8px}.u-w100{width:100%}.u-w72{width:72px}.u-w110{width:110px;margin:0}.u-w90r{width:90px;text-align:right}.u-fs44{font-size:44px}

/* ---- versão do programa (rodapé do menu lateral) ---- */
.u-ver{margin-top:auto;padding:8px 0 2px;font-size:10px;color:var(--mu);text-align:center;opacity:.8}
.u-author{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.15px;color:var(--mu)}
/* ---- seletor pequeno e caixas de seleção de indicadores ---- */
.ind-ck{display:flex;align-items:center;gap:8px;text-align:left;margin:8px 0;font-size:14px;color:var(--tx);width:100%}
.ind-ck input{width:auto;flex:0 0 auto;margin:0}
.dsel{position:relative;flex:1;min-width:0;margin:0}
.dsel-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:14px}
.dsel-p{display:none;position:static;margin-top:4px;max-height:180px;overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
.dsel.open{z-index:70}
.dsel.open .dsel-p{display:block;animation:surge var(--dur) var(--ease) both}
.dsel-o{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--tx);font-size:14px}
.dsel-o.on,.dsel-o:active{background:var(--bd)}

/* =====================================================================
   REDESIGN v4 — identidade visual Super Tudo (camada por cima do CSS atual)
   Tokens → base → navegação → componentes → janelas → responsivo
   ===================================================================== */
:root{--pr:#2457e6;--on:#fff;--vi:#6a4bff;--prs:#eaf0ff;--ac:#6a4bff;--bg:#f5f6f9;--tx:#101828;--mu:#667085;--bd:#e4e7ec;--sf:#eef1f6;--ok:#12805c;--no:#d92d20;--wa:#b54708;--oks:#e6f5ee;--nos:#fdecea;--was:#fff3e0;
--fn:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
--r-s:8px;--r-m:10px;--r-l:14px;--rad:10px;--rad-sheet:16px;
--sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 8px 24px rgba(16,24,40,.10);--sb:240px}



/* base */
body{font:14.5px/1.45 var(--fn);color:var(--tx);background:var(--bg);padding-bottom:92px;-webkit-font-smoothing:antialiased}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}
header{padding:16px 16px 6px;gap:8px}header>div:first-child{margin-right:auto;min-width:0}
header h1{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.2px}
header p{font-size:12.5px;margin:3px 0 0 42px}
.logo,.lgt{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--pr);color:var(--on);flex:0 0 auto}.logo .ic{width:19px;height:19px}
main{padding:8px 16px}
h2{font-size:15px;font-weight:650;letter-spacing:-.1px;margin:22px 2px 8px}h3{font-size:14px;font-weight:650;margin:0 0 8px}h4{font-size:12.5px;font-weight:650;margin:14px 0 4px}
.mu{font-size:12.5px}.big{font-size:28px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15}
label{font:500 12.5px var(--fn);margin:10px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--vi);outline-offset:2px}

/* botões de cabeçalho */
.dots{width:38px;height:38px;border-radius:var(--r-m);background:var(--cd);border:1px solid var(--bd);color:var(--tx);display:grid;place-items:center;font-size:13px;font-weight:700;gap:0;padding:0}
.dots[style*="display:none"]{display:none!important}
#snd{width:auto;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;gap:6px}#snd[style*="display:none"]{display:none!important}
#snd .cb{background:var(--no);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}
#bn{box-shadow:0 0 0 2px var(--cd)}

/* cartões e listas */
.c,details{border-radius:var(--r-l);padding:14px;box-shadow:var(--sh1)}
.c.nw{border-left:3px solid var(--vi)}
.g2{gap:10px}.g2 .c{padding:14px 14px 12px}.g2 .c .mu:first-child{margin-bottom:4px}
.it{padding:11px 0;gap:10px}.it:first-child{border-top:0}
details{padding:4px 14px}summary{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:600}
summary::after{content:"";width:7px;height:7px;border:solid var(--mu);border-width:0 1.8px 1.8px 0;transform:rotate(45deg);transition:transform var(--dur) var(--ease);margin:-3px 4px 0 8px}
details[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details[open]>summary{border-bottom:1px solid var(--bd);margin-bottom:8px}
table{font-size:13px}th{font-size:12px;font-weight:600;color:var(--mu);padding:8px 6px}td{padding:9px 6px}

/* botões */
.bt{border-radius:var(--r-s);padding:9px 14px;font:600 14px var(--fn);border:1px solid transparent;line-height:1.25}
.bt.g{background:var(--cd);color:var(--tx);border-color:var(--bd)}
.bt.d{background:var(--nos);color:var(--no);padding:7px 10px}
.bt:disabled{opacity:.5}
.ch{border-radius:var(--r-s);padding:7px 12px;font:500 13px var(--fn);color:var(--mu)}
.ch.on{background:var(--prs);color:var(--pr);font-weight:600}
.chs{scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.b{border-radius:6px;padding:2px 8px;font-weight:600}.b.ok{background:var(--oks)}.b.no{background:var(--nos)}.b.wa{background:var(--was)}

/* campos */
input,select,textarea{border-radius:var(--r-s);background:var(--cd);padding:10px 11px;font:15px var(--fn);transition:border-color var(--dur-f),box-shadow var(--dur-f)}

/* ---- Super Tudo Motion System v1: movimentos consistentes e leves ---- */
:root{
 --motion-fast:140ms;
 --motion-base:220ms;
 --motion-enter:280ms;
 --ease-standard:cubic-bezier(.2,0,0,1);
 --ease-enter:cubic-bezier(.16,1,.3,1);
 
 --ease-emphasis:cubic-bezier(.22,1,.36,1);
}
@keyframes st-fade-in{from{opacity:0}to{opacity:1}}
@keyframes st-rise-in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes st-menu-in{from{opacity:0;transform:translate3d(0,-6px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes st-sheet-in{from{opacity:.85;transform:translate3d(0,22px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes st-modal-in{from{opacity:0;transform:translate3d(0,8px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}

/* Conteúdo: entrada curta, sem cascata longa que atrase a leitura */
.an>*{animation:st-rise-in var(--motion-enter) var(--ease-enter) both}
.an>*:nth-child(2){animation-delay:18ms}
.an>*:nth-child(3){animation-delay:36ms}
.an>*:nth-child(4){animation-delay:54ms}
.an>*:nth-child(n+5){animation-delay:0ms}
.an .bar i{animation:gr 650ms var(--ease-enter) both}
.an .cols i{animation:gh 520ms var(--ease-enter) both}
.an .rg{animation:rg 650ms var(--ease-enter) both}

/* Camadas e navegação */
.dd,.nbx{animation:st-menu-in 180ms var(--ease-enter) both;transform-origin:top right}
.sheet{animation:st-sheet-in var(--motion-enter) var(--ease-enter) both;overscroll-behavior:contain}
.dim{animation:st-fade-in 180ms ease-out both}
.balloon{animation:st-modal-in 200ms var(--ease-enter) both}
details[open]>:not(summary){animation:st-rise-in 180ms var(--ease-enter) both}

/* Resposta tátil: sem o "salto" exagerado ao tocar em qualquer botão */
button,.c,.ch,.day,.reg-menu-tile{
 transition:transform var(--motion-fast) var(--ease-standard),
 background-color var(--motion-base) var(--ease-standard),
 border-color var(--motion-base) var(--ease-standard),

/* ==========================================================
   SISTEMA DE MOVIMENTO NATIVO — Super Tudo
   Movimento curto, funcional e sem efeitos decorativos.
   ========================================================== */
:root{
  --dur-fast:150ms;
  
  
  --ease-out:cubic-bezier(0.2,0.8,0.2,1);
  
  
}
.pressable{
  transition-property:transform!important;
  transition-duration:var(--dur-fast)!important;
  transition-timing-function:var(--ease-out)!important;
}
.pressable:active{
  transform:scale(.96)!important;
}
/* Press-and-hold nas ações principais */
.hold-action{position:relative!important;isolation:isolate;overflow:hidden}
.hold-action>.hold-bubble{
  position:absolute;left:50%;top:50%;width:var(--hold-diameter);height:var(--hold-diameter);
  border-radius:50%;background:var(--hold-color);pointer-events:none;z-index:0;
  transform:translate(-50%,-50%) scale(0);transform-origin:center;
  transition:transform 600ms cubic-bezier(.2,.8,.2,1);
}
.hold-action>.hold-bubble.is-growing{transform:translate(-50%,-50%) scale(1)}
.hold-action>.hold-bubble.is-receding{
  transform:translate(-50%,-50%) scale(0);
  transition-duration:150ms;
}
.hold-action>*:not(.hold-bubble){position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){
  .hold-action>.hold-bubble{transition:none!important}
}
@media (prefers-reduced-motion:reduce){
  :root{
    --dur-fast:0ms;
    
    
  }
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    transform:none!important;
    scroll-behavior:auto!important;
  }
}

.origin-overlay-animated{animation:none!important}

/* =====================================================================
   SUPER TUDO — CONTRATO GLOBAL DE MOVIMENTO v2
   Respostas rápidas, consistentes e acessíveis em todos os módulos.
   ===================================================================== */
:root{
  --ui-motion-feedback:120ms;
  --ui-motion-state:190ms;
  --ui-motion-enter:250ms;
  --ui-motion-panel:300ms;
  --ui-motion-standard:cubic-bezier(.2,.8,.2,1);
  --ui-motion-emphasis:cubic-bezier(.22,1,.36,1);
}
button.bt,
button.ch,
button.dots,
.reg-menu-tile,
.reg-back-mini,
nav button{
  transition:
    transform var(--ui-motion-feedback) var(--ui-motion-emphasis),
    background-color var(--ui-motion-state) var(--ui-motion-standard),
    border-color var(--ui-motion-state) var(--ui-motion-standard),
    color var(--ui-motion-state) var(--ui-motion-standard),
    box-shadow var(--ui-motion-state) var(--ui-motion-standard),
    filter var(--ui-motion-state) var(--ui-motion-standard);
}
button.bt:not(:disabled):active,
button.ch:not(:disabled):active,
button.dots:not(:disabled):active,
.reg-menu-tile:active,
.reg-back-mini:active{transform:scale(.985)}
.ch.on{box-shadow:0 1px 3px color-mix(in srgb,var(--pr) 14%,transparent)}
nav button{position:relative;overflow:hidden}
nav button .ni{
  transition:transform var(--ui-motion-feedback) var(--ui-motion-emphasis),
    background-color var(--ui-motion-state) var(--ui-motion-standard),
    color var(--ui-motion-state) var(--ui-motion-standard);
}
nav button .nl{
  transition:opacity var(--ui-motion-state) var(--ui-motion-standard),
    transform var(--ui-motion-state) var(--ui-motion-standard);
  transform:translateY(2px);
}
nav button.on .ni{transform:translateY(-1px) scale(1.06)}
nav button.on .nl{transform:translateY(0)}
nav button::after{
  content:"";position:absolute;left:50%;bottom:2px;width:0;height:3px;
  border-radius:999px;background:var(--pr);opacity:0;
  transform:translateX(-50%);
  transition:width var(--ui-motion-state) var(--ui-motion-emphasis),
    opacity var(--ui-motion-state) var(--ui-motion-standard);
  pointer-events:none;
}
nav button.on::after{width:18px;opacity:1}
.dashboard-home .c[onclick],
.page-content .c[onclick],
.page-content .c.tap,
.reg-menu-tile{
  transition:transform var(--ui-motion-feedback) var(--ui-motion-emphasis),
    border-color var(--ui-motion-state) var(--ui-motion-standard),
    box-shadow var(--ui-motion-state) var(--ui-motion-standard),
    background-color var(--ui-motion-state) var(--ui-motion-standard);
}
@media(hover:hover) and (pointer:fine){
  button.bt:not(:disabled):hover,
  button.ch:not(:disabled):hover,
  button.dots:not(:disabled):hover,
  .reg-back-mini:hover{filter:brightness(1.035)}
  .dashboard-home .c[onclick]:hover,
  .page-content .c[onclick]:hover,
  .page-content .c.tap:hover,
  .reg-menu-tile:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
  nav button:not(.on):hover{background:var(--sf)}
}
input:not([type="checkbox"]):not([type="radio"]),
select,textarea{
  transition:border-color var(--ui-motion-state) var(--ui-motion-standard),
    box-shadow var(--ui-motion-state) var(--ui-motion-standard),
    background-color var(--ui-motion-state) var(--ui-motion-standard);
}
input:not([type="checkbox"]):not([type="radio"]):focus-visible,
input[type="checkbox"]:focus-visible,
input[type="radio"]:focus-visible,
select:focus-visible,textarea:focus-visible{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 15%,transparent);
}

.bar i,.cols i,.rg{
  animation-duration:var(--ui-motion-panel);
  animation-timing-function:var(--ui-motion-standard);
}
@media(prefers-reduced-motion:reduce){
  button.bt,button.ch,button.dots,.reg-menu-tile,.reg-back-mini,
  nav button,nav button .ni,nav button .nl,nav button::after,

    transition:none!important;
  }

  button.dots:not(:disabled):active,.reg-menu-tile:active,
  .reg-back-mini:active,nav button.on .ni{transform:none!important}
  nav button::after{display:none!important}
}
